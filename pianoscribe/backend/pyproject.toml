[project]
name = "pianoscribe"
version = "0.1.0"
description = "Lokale Desktop-App: Klavier aus Audio isolieren, transkribieren und als Notenblatt ausgeben."
requires-python = "==3.11.*"
license = { text = "MIT" }
authors = [{ name = "Flo Gramsch" }]

# Versionen per Spike verifiziert (siehe ../spikes/RESULTS.md).
dependencies = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "demucs==4.1.0",
    "beat-this==1.1.0",
    "music21==10.5.0",
    "numpy>=2.0,<3",
    "soundfile>=0.13",
    "mido>=1.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "pywebview>=5.3",
    "python-multipart>=0.0.9",
]

[project.scripts]
pianoscribe = "pianoscribe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "mir-eval>=0.8",
    "verovio>=6.3",
]
build = [
    "pyinstaller>=6.10",
]

[tool.uv]
# Nur Windows (Ziel) und Linux (Entwicklung/CI) auflösen.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pianoscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "models: braucht heruntergeladene Modellgewichte (langsam, standardmäßig übersprungen)",
]
addopts = "-m 'not models'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "ANN", "SIM", "RUF"]
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
