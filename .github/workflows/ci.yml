name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Qt-Systembibliotheken installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install cffi cryptography
          pip install -e ".[dev,llm,keyring,comics]"

      - name: Ruff (Lint)
        run: ruff check kindle_meta tests

      - name: Tests mit Coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --cov=kindle_meta --cov-report=term-missing
