name: Realm of Coworkers

on:
  push:
    paths:
      - "realm-of-coworkers/**"
      - ".github/workflows/realm-of-coworkers.yml"
  pull_request:
    paths:
      - "realm-of-coworkers/**"
      - ".github/workflows/realm-of-coworkers.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realm-of-coworkers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Inhalte prüfen
        run: pnpm content:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Balance (13.9)
        run: pnpm balance
      - name: Browser installieren (Playwright)
        run: pnpm exec playwright install --with-deps chromium
      - name: Abnahme M7 und M8 im Browser
        run: pnpm exec playwright test
      - name: Bericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ergebnisse
          path: realm-of-coworkers/test-results/
          retention-days: 7
