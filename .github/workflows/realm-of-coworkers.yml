name: Realm of Coworkers

on:
  push:
    paths:
      - "realm-of-coworkers/**"
      - ".github/workflows/realm-of-coworkers.yml"
  pull_request:
    paths:
      - "realm-of-coworkers/**"
      - ".github/workflows/realm-of-coworkers.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realm-of-coworkers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Inhalte prüfen
        run: pnpm content:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Balance (13.9)
        run: pnpm balance
